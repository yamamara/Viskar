# Publishes firestore.rules to Firebase.
#
# Kept separate from the Pages build: the site and the database rules are
# different artifacts with different failure modes, and a rules change should
# not require a full site rebuild to take effect.
name: Deploy Firestore rules

on:
  push:
    branches: ["master"]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firestore-rules.yml"
  # Lets you deploy the current rules on demand from the Actions tab.
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Talks to firebaserules.googleapis.com directly. firebase-tools would
      # also demand Service Usage permissions for its API-enablement preflight,
      # which has nothing to do with publishing rules.
      - name: Deploy rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-firestore-rules.mjs
